<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Ofojero Intelligence</title>
    <style>
        body { background: #090d16; color: #f3f4f6; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        header { background: #111827; padding: 18px; text-align: center; font-size: 1.3rem; font-weight: 700; border-bottom: 1px solid #1f2937; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; max-width: 750px; margin: 0 auto; width: 100%; }
        .message { padding: 14px 18px; border-radius: 16px; max-width: 80%; line-height: 1.6; word-break: break-word; }
        .user { background: #2563eb; align-self: flex-end; color: white; }
        .ai { background: #1f2937; align-self: flex-start; color: #e5e7eb; border: 1px solid #374151; }
        #input-area { padding: 20px; background: #111827; display: flex; justify-content: center; border-top: 1px solid #1f2937; }
        .input-wrapper { width: 100%; max-width: 700px; display: flex; background: #1f2937; border-radius: 30px; border: 1px solid #374151; padding: 5px; }
        input { flex: 1; padding: 12px 18px; border: none; background: transparent; color: white; outline: none; font-size: 1rem; }
        button { padding: 10px 22px; border-radius: 24px; border: none; background: #3b82f6; color: white; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>
    <header>Ofojero Intelligence</header>
    
    <div id="chat-container">
        <div class="message ai">Salam! Mən Ofojero Intelligence sistemiyəm. Hansı mövzuda kömək edə bilərəm?</div>
    </div>

    <div id="input-area">
        <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="Mesajınızı daxil edin..." onkeydown="if(event.key==='Enter') sendMsg()">
            <button onclick="sendMsg()">Göndər</button>
        </div>
    </div>

    <script>
        let lastSubject = "";

        function sendMsg() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if (!text) return;

            container.innerHTML += `<div class="message user">${text}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            setTimeout(() => {
                const lower = text.toLowerCase();
                let reply = "";

                // Salamlaşma və hal-əhval yoxlaması
                if (lower.includes("salam") || lower.includes("hey")) {
                    reply = "Salam! Necəsən? Hansı mövzuda kömək edə bilərəm?";
                } else if (lower.includes("necərsən") || lower.includes("neynirsən")) {
                    reply = "Çox sağ ol, mən əlayam! Səninlə söhbət etməyə və suallarını cavablandırmağa hazıram. Sən necəsən?";
                } else if (lower.includes("adın") || lower.includes("kimsən")) {
                    reply = "Mən Ofojero Intelligence — sənin yaratdığın süni intellekt köməkçisiyəm.";
                } 
                // Davam etmək və ya sonrakı hissəni istəmək
                else if (lower.includes("sonra") || lower.includes("davam et")) {
                    if (lastSubject) {
                        reply = `"${lastSubject}" mövzusunu davam etdirək: Bu sahənin digər maraqlı tərəfləri də var. Məsələn, buradakı əsas detallar və proseslər qarşılıqlı əlaqədə inkişaf edir. Daha nəyi bilmək istəyirsən?`;
                    } else {
                        reply = "Nəyi davam edək? Öncə hansı mövzu haqqında danışdığımızı yaz, davamını gətirim.";
                    }
                } 
                // Ümumi istənilən sual üçün
                else {
                    lastSubject = text;
                    reply = `"${text}" haqqında istədiyin məlumatı verə bilərəm. Bu mövzu olduqca maraqlıdır və özündə bir çox fərqli istiqaməti birləşdirir. Konkret hansı hissəsini öyrənmək istəyirsən?`;
                }

                container.innerHTML += `<div class="message ai">${reply}</div>`;
                container.scrollTop = container.scrollHeight;
            }, 500);
        }
    </script>
</body>
</html>
