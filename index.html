<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Ofojero</title>
    <style>
        :root {
            --bg-deep: #030407;
            --bg-panel: #080c14;
            --bg-input: #0d1322;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        body {
            background: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        header {
            background: var(--bg-panel);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--accent);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .status-badge {
            font-size: 0.8rem;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            font-weight: 600;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 1050px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        .message {
            padding: 16px 20px;
            border-radius: 16px;
            max-width: 85%;
            line-height: 1.6;
            word-break: break-word;
            font-size: 1.02rem;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            align-self: flex-end;
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25);
        }

        .ai {
            background: var(--bg-panel);
            align-self: flex-start;
            color: var(--text-main);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .quick-topics {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 8px 24px 14px 24px;
            max-width: 1050px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .topic-pill {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.88rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            font-weight: 500;
        }

        .topic-pill:hover {
            background: var(--accent);
            color: var(--bg-deep);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        #input-area {
            padding: 20px 24px;
            background: var(--bg-panel);
            display: flex;
            justify-content: center;
            border-top: 1px solid var(--border);
        }

        .input-wrapper {
            width: 100%;
            max-width: 1000px;
            display: flex;
            background: var(--bg-input);
            border-radius: 35px;
            border: 1px solid var(--border);
            padding: 6px 8px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
        }

        input {
            flex: 1;
            padding: 12px 18px;
            border: none;
            background: transparent;
            color: white;
            outline: none;
            font-size: 1.02rem;
        }

        button {
            padding: 12px 28px;
            border-radius: 30px;
            border: none;
            background: var(--accent);
            color: var(--bg-deep);
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover { background: var(--accent-hover); }
        button:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <header>
        <span>Ofojero</span>
        <div class="status-badge">Aktiv 🚀</div>
    </header>
    
    <div id="chat-container">
        <div class="message ai">Salam! Ofojero bazası tam gücü və genişləndirilmiş ensiklopedik modulları ilə aktivdir. Nəyi öyrənmək istəyirsən?</div>
    </div>

    <div class="quick-topics">
        <div class="topic-pill" onclick="sendPreset('Kriştiano Ronaldo')">⚽ Ronaldo</div>
        <div class="topic-pill" onclick="sendPreset('Lionel Messi')">⚽ Messi</div>
        <div class="topic-pill" onclick="sendPreset('Futbol məşqçiliyi')">📋 Məşqçilik</div>
        <div class="topic-pill" onclick="sendPreset('Interstellar')">🎬 Interstellar</div>
        <div class="topic-pill" onclick="sendPreset('Python')">💻 Python</div>
        <div class="topic-pill" onclick="sendPreset('Next.js')">⚡ Next.js</div>
        <div class="topic-pill" onclick="sendPreset('Albert Eynşteyn')">🌟 Eynşteyn</div>
        <div class="topic-pill" onclick="sendPreset('Qara dəlik')">🌌 Qara dəlik</div>
        <div class="topic-pill" onclick="sendPreset('Azərbaycan')">🇦🇿 Azərbaycan</div>
        <div class="topic-pill" onclick="sendPreset('Bitcoin')">🪙 Bitcoin</div>
    </div>

    <div id="input-area">
        <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="İstənilən mövzunu yazın, riyazi məsələ həll edin..." onkeydown="if(event.key==='Enter') sendMsg()">
            <button onclick="sendMsg()">Göndər</button>
        </div>
    </div>

    <script>
        // OFOJERO MEGA BAZA
        const knowledgeBase = {
            "salam": "Salam! Ofojero bazası xidmətinizdədir. İstənilən elm, texnologiya, tarix, idman və ya mədəniyyət mövzusunu soruşa bilərsiniz.",
            "necərsən": "Hər şey əladır! Bütün ensiklopedik modullar maksimum güclə işləyir.",
            "adın nədir": "Mən Ofojero — sənin universal süni intellekt köməkçisiyəm.",
            "kimsən": "Mən Ofojero; elm, texnologiya, kino, idman, tarix və proqramlaşdırma biliklərini özümdə birləşdirən universal sisteməm.",

            // Kino, Serial, Animasiya
            "breaking bad": "Breaking Bad — kimya müəlliminin narkotik imperiyası qurmasından bəhs edən televiziya tarixinin ən yaxşı dram seriallarından biridir.",
            "game of thrones": "Game of Thrones — siyasi intriqalar, əjdahalar və səltənət mübarizələri ilə dolu kult fantastik serialdır.",
            "interstellar": "Interstellar — qurd dəlikləri, nisbilik və zaman səyahətindən bəhs edən Christopher Nolan-ın dahi filmidir.",
            "inception": "Inception — yuxular içində yuxu qurmaq və şüura təsir etmək mövzusundan bəhs edən kult filmdir.",
            "up": "Pixar-ın 'Up' animasiya filmi — Karl və Ellinin həyat hekayəsindən bəhs edən unikal və emosional şah əsərdir.",
            "matrix": "The Matrix — gerçəkliyin simulyasiya olduğunu və insanlığın maşınlar tərəfindən idarə edildiyini göstərən fəlsəfi filmdir.",
            "dark": "Dark — zaman səyahətinin səbəb olduğu paradoksları araşdıran dahi Alman istehsalı sirr və dram serialıdır.",

            // Mifologiya
            "zevs": "Zevs — yunan mifologiyasında tanrıların və insanların atası, Olimpin hökmdarı və şimşək tanrısıdır.",
            "tor": "Tor — skandinaviya mifologiyasında çəkici ilə tanınan güclü şimşək və fırtına tanrısıdır.",
            "poseydon": "Poseydon — yunan mifologiyasında dənizlərin və zəlzələlərin hökmdarıdır.",

            // Avtomobillər
            "ferrari": "Ferrari — İtaliyanın məşhur idman avtomobilləri istehsalçısı və Formula 1 əfsanəsidir.",
            "lamborghini": "Lamborghini — aqressiv dizaynı və güclü mühərrikləri ilə tanınan İtalyan superkar markasıdır.",
            "tesla": "Tesla — elektromobillər və təmiz enerji sahəsində lider olan qlobal texnologiya şirkətidir.",
            "bmw": "BMW — 'Sürüş həzz' prinsipi ilə tanınan lüks alman avtomobil markasıdır.",
            "mercedes-benz": "Mercedes-Benz — qabaqcıl texnologiyaları və rahatlığı ilə seçilən alman avtomobil nəhəngidir.",

            // Ünlülər və Musiqi
            "leonardo di kaprio": "Leonardo Di Caprio — 'Titanik' və 'Inception' kimi filmlərin ulduzu, Oskar mükafatlı aktyordur.",
            "michael jackson": "Michael Jackson — musiqi tarixinin 'Pop Kralı' adlandırılan əfsanəvi sənətçisidir.",
            "the beatles": "The Beatles — musiqi tarixini kökündən dəyişdirən dahi britaniyalı qrupdur.",
            "queen": "Queen — Freddi Merkurinin unikal səsi ilə tanınan əfsanəvi rok qrupudur.",
            "mozart": "Wolfgang Amadeus Mozart — klassik musiqi tarixinin ən dahi bəstəkarlarından biridir.",

            // Elm və Dahilər
            "albert eynşteyn": "Albert Eynşteyn — fizika elmini kökündən dəyişdirən, nisbilik nəzəriyyəsinin müəllifi dahi fizikdir.",
            "isaak nyuton": "İsaak Nyuton — klassik mexanikanın təməlini qoyan və cazibə qüvvəsini kəşf edən dahi alimdir.",
            "nikola tesla": "Nikola Tesla — elektrik enerjisi və alternativ cərəyan sahəsində inqilab edən ixtiraçıdır.",
            "stiven hokinq": "Stiven Hokinq — qara dəliklər və kosmologiya sahəsində dahi kəşflər etmiş fizikdir.",
            "qara dəlik": "Qara dəlik — cazibə qüvvəsi səbəbindən işığın belə qaçıb qurtula bilmədiyi kosmik obyektdir.",

            // İdman
            "kriştiano ronaldo": "Kriştiano Ronaldo — rekordları alt-üst edən, intizamı və qol instinkti ilə seçilən qlobal idman əfsanəsidir.",
            "lionel messi": "Lionel Messi — futbol tarixinin ən çox 'Qızıl Top' qazanan unikal oyunçusudur.",
            "futbol məşqçiliyi": "Futbol məşqçiliyi — komandanın taktiki quruluşunu, fiziki hazırlığını və oyun intizamını idarə edən peşəkar fəaliyyətdir.",
            "futbol": "Futbol — 11 oyunçudan ibarət iki komanda arasında strategiya və sürətə əsaslanan qlobal oyun növüdür.",
            "basketbol": "Basketbol — səbətə top atmaq üzrə qurulan dinamik komanda idman növüdür.",

            // Ölkələr və Kodlar
            "azerbaycan": "Azərbaycan — Cənubi Qafqazda yerləşən müstəqil dövlətdir. Paytaxtı Bakıdır. Beynəlxalq telefon kodu: +994.",
            "türkiyə": "Türkiyə — Asiya və Avropanı birləşdirən strateji ölkədir. Beynəlxalq telefon kodu: +90.",
            "yaponiya": "Yaponiya — qabaqcıl texnologiyaları ilə seçilən ada ölkəsidir. Telefon kodu: +81.",
            "cənubi koreya": "Cənubi Koreya — Şərqi Asiyada yerləşən texnologiya mərkəzidir. Telefon kodu: +82.",
            "çin": "Çin — nəhəng iqtisadiyyata malik qlobal dövlətdir. Telefon kodu: +86.",
            "hollandiya": "Hollandiya (Niderland) — inkişaf etmiş Avropa ölkəsidir. Telefon kodu: +31.",

            // Proqramlaşdırma
            "python": "Python — süni intellekt və veb inkişafında ən çox istifadə edilən güclü dildir.",
            "javascript": "JavaScript — veb səhifələrə interaktivlik qazandıran internetin əsas dilidir.",
            "react": "React — interfeyslər yaratmaq üçün Meta tərəfindən hazırlanmış populyar kitabxanadır.",
            "next.js": "Next.js — səhifə optimizasiyası təmin edən qabaqcıl React freymvorkudur.",
            "github": "GitHub — proqramçıların kod bazalarını saxladığı və idarə etdiyi platformadır.",
            "vercel": "Vercel — tətbiqləri bulud üzərində sürətlə yerləşdirmək üçün istifadə olunan platformadır.",
            "bitcoin": "Bitcoin — blokçeyn texnologiyasına əsaslanan ilk rəqəmsal valyutadır.",
            "süni intellekt": "Süni intellekt — kompüter sistemlərinin insan kimi düşünmək və öyrənmək qabiliyyətidir.",

            // Musiqi alətləri və Gündəlik
            "akustik gitara": "Akustik gitara — polad simləri ilə gur səs çıxaran simli musiqi alətidir. Körpü mismarları (bridge pins) onun simlərini sabit saxlayır.",
            "gerkules": "Gerkules (yulaf sıyığı) — süd, bal və qozla qəbul edildikdə bədənə uzunmüddətli enerji verən faydalı qidadır.",
            "sloven dili": "Sloven dili — xüsusi ikilik qrammatik halı (dual) ilə seçilən slavyan dilidir."
        };

        function sendPreset(text) {
            document.getElementById('user-input').value = text;
            sendMsg();
        }

        function sendMsg() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if (!text) return;

            container.innerHTML += `<div class="message user">${text}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            setTimeout(() => {
                const lower = text.toLowerCase();
                let reply = "";

                // 1. Riyazi hesablamaların avtomatik həlli
                if (/[0-9]/.test(lower) && (/[\+\-\*\/\^]/.test(lower))) {
                    try {
                        let cleanExpr = text.replace(/[^0-9+\-*/().]/g, '');
                        if (cleanExpr.length > 0) {
                            let result = eval(cleanExpr);
                            reply = `Nəticə: ${result}`;
                        }
                    } catch (e) {}
                }

                // 2. Bazadan axtarış
                if (!reply) {
                    for (let key in knowledgeBase) {
                        if (lower.includes(key)) {
                            reply = knowledgeBase[key];
                            break;
                        }
                    }
                }

                // 3. Əgər tapılmasa
                if (!reply) {
                    reply = `Ofojero bazanı skan etdi: "${text}" mövzusu qeydə alındı. İstərsən bu məlumatı da dərhal əlavə edək!`;
                }

                container.innerHTML += `<div class="message ai">${reply}</div>`;
                container.scrollTop = container.scrollHeight;
            }, 300);
        }
    </script>
</body>
</html>
