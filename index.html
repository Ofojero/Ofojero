<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Ofojero AI Pro</title>
    <style>
        body { background: #030712; color: #f9fafb; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        header { background: #111827; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #1f2937; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; max-width: 700px; margin: 0 auto; width: 100%; }
        .message { padding: 12px 18px; border-radius: 15px; max-width: 80%; line-height: 1.5; word-break: break-word; }
        .user { background: #3b82f6; align-self: flex-end; }
        .ai { background: #1f2937; align-self: flex-start; }
        #input-area { padding: 20px; background: #111827; display: flex; justify-content: center; border-top: 1px solid #1f2937; }
        input { width: 100%; max-width: 600px; padding: 15px; border-radius: 20px; border: none; background: #374151; color: white; outline: none; }
        button { padding: 10px 20px; border-radius: 20px; border: none; background: #3b82f6; color: white; cursor: pointer; margin-left: 10px; font-weight: bold; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <header>Ofojero AI Pro ✨</header>
    
    <div id="chat-container">
        <div class="message ai">Salam! Mən Ofojero AI-yam. İnternetə və böyük dil modellərinə qoşuldum. İstədiyin sualı verə bilərsən!</div>
    </div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Sualını bura yaz..." onkeydown="handleKey(event)">
        <button onclick="getAIResponse()">Göndər</button>
    </div>

    <script>
        // Sənin Groq API açarın
        const apiKey = "Gsk_IxcyBBNPv7j8Z1yraQyCWGdyb3FY59xRePkYXRpP40Fj7Gnq3oCU";

        async function getAIResponse() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if (!text) return;

            // İstifadəçi mesajını əlavə et
            container.innerHTML += `<div class="message user">${text}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            // "Yazır..." effekti üçün müvəqqəti mesaj
            const loadingId = 'loading-' + Date.now();
            container.innerHTML += `<div class="message ai" id="${loadingId}">Ofojero düşünür...</div>`;
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${apiKey}`, 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: text }]
                    })
                });

                const data = await response.json();
                const aiReply = data.choices[0].message.content;

                // "Düşünür..." mesajını sil və əsl cavabı yaz
                document.getElementById(loadingId).remove();
                container.innerHTML += `<div class="message ai">${aiReply}</div>`;
            } catch (error) {
                document.getElementById(loadingId).remove();
                container.innerHTML += `<div class="message ai">Xəta baş verdi, zəhmət olmasa bir daha yoxla.</div>`;
            }
            container.scrollTop = container.scrollHeight;
        }

        function handleKey(event) {
            if (event.key === 'Enter') {
                getAIResponse();
            }
        }
    </script>
</body>
</html>
