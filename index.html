<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Ofojero - Ultimate Mega Edition</title>
    <style>
        :root {
            --bg-deep: #030407;
            --bg-panel: #080c14;
            --bg-input: #0d1322;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        body {
            background: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        header {
            background: var(--bg-panel);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--accent);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .status-badge {
            font-size: 0.8rem;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            font-weight: 600;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 1050px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        .message {
            padding: 16px 20px;
            border-radius: 16px;
            max-width: 85%;
            line-height: 1.6;
            word-break: break-word;
            font-size: 1.02rem;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            align-self: flex-end;
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25);
        }

        .ai {
            background: var(--bg-panel);
            align-self: flex-start;
            color: var(--text-main);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .quick-topics {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 8px 24px 14px 24px;
            max-width: 1050px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .topic-pill {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.88rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            font-weight: 500;
        }

        .topic-pill:hover {
            background: var(--accent);
            color: var(--bg-deep);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        #input-area {
            padding: 20px 24px;
            background: var(--bg-panel);
            display: flex;
            justify-content: center;
            border-top: 1px solid var(--border);
        }

        .input-wrapper {
            width: 100%;
            max-width: 1000px;
            display: flex;
            background: var(--bg-input);
            border-radius: 35px;
            border: 1px solid var(--border);
            padding: 6px 8px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
        }

        input {
            flex: 1;
            padding: 12px 18px;
            border: none;
            background: transparent;
            color: white;
            outline: none;
            font-size: 1.02rem;
        }

        button {
            padding: 12px 28px;
            border-radius: 30px;
            border: none;
            background: var(--accent);
            color: var(--bg-deep);
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover { background: var(--accent-hover); }
        button:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <header>
        <span>Ofojero</span>
        <div class="status-badge">Ultimate Mega Edition 🌍</div>
    </header>
    
    <div id="chat-container">
        <div class="message ai">Salam! Ofojero Ultimate Mega bazası aktivdir. Dünya ölkələri, kino, elm, avtomobillər, kosmos və istənilən digər sahə üzrə suallarınızı gözləyirəm!</div>
    </div>

    <div class="quick-topics">
        <div class="topic-pill" onclick="sendPreset('Futbol məşqçiliyi')">📋 Məşqçilik</div>
        <div class="topic-pill" onclick="sendPreset('Körpü mismarları')">🎸 Körpü mismarları</div>
        <div class="topic-pill" onclick="sendPreset('Gerkules')">🥣 Gerkules</div>
        <div class="topic-pill" onclick="sendPreset('Interstellar')">🎬 Interstellar</div>
        <div class="topic-pill" onclick="sendPreset('Ferrari')">🏎️ Ferrari</div>
        <div class="topic-pill" onclick="sendPreset('Kvant fizikası')">⚛️ Kvant fizikası</div>
        <div class="topic-pill" onclick="sendPreset('Albert Eynşteyn')">🌟 Eynşteyn</div>
        <div class="topic-pill" onclick="sendPreset('Python')">💻 Python</div>
    </div>

    <div id="input-area">
        <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="İstənilən ölkə, kino, elm, avtomobil və ya riyazi məsələ yazın..." onkeydown="if(event.key==='Enter') sendMsg()">
            <button onclick="sendMsg()">Göndər</button>
        </div>
    </div>

    <script>

        const knowledgeBase = {

            "salam": "Salam! Ofojero Ultimate bazası tam gücü ilə xidmətinizdədir.",
            "hello": "Hello! I am Ofojero, your ultimate AI encyclopedic assistant.",
            "privet": "Привет! Офоджеро готов к работе.",

            // İdman və Məşqçilik

            "kriştiano ronaldo": "Kriştiano Ronaldo — rekordları alt-üst edən, intizamı və qol instinkti ilə seçilən qlobal idman əfsanəsidir.",

            "formula 1": "Formula 1 — dünyanın ən sürətli və qabaqcıl mühəndislik tələb edən avtoidman yarışmasıdır.",

            // Musiqi və Alətlər
            "körpü mismarları": "Körpü mismarları (bridge pins) — akustik gitara simlərini körpüdə möhkəm saxlayan kiçik mıxvari elementlərdir. Onları dəyişmək üçün xüsusi mismar çəkən alətlərdən istifadə olunur.",
            "gitara": "Gitara — akustik, klassik və elektro növləri olan məşhur simli musiqi alətidir.",
            "piano": "Piano — zəngin səslənməyə malik klassik klavişli musiqi alətidir.",
            "gerkules": "Gerkules (yulaf sıyığı) — süd, bal və qozla qəbul edildikdə bədənə uzunmüddətli enerji verən faydalı qidadır.",
            "the beatles": "The Beatles — musiqi tarixini kökündən dəyişdirən dahi britaniyalı rok qrupudur.",
            "queen": "Queen — Freddi Merkurinin unikal səsi ilə tanınan əfsanəvi rok qrupudur.",
            "michael jackson": "Michael Jackson — musiqi tarixinin 'Pop Kralı' adlandırılan əfsanəvi sənətçisidir.",

            // Kino və Seriallar
            "interstellar": "Interstellar — qurd dəlikləri, nisbilik və zaman səyahətindən bəhs edən Christopher Nolan-ın dahi filmidir.",
            "inception": "Inception — yuxular içində yuxu qurmaq və şüura təsir etmək mövzusundan bəhs edən kult filmdir.",
            "breaking bad": "Breaking Bad — kimya müəlliminin narkotik imperiyası qurmasından bəhs edən televiziya tarixinin ən yaxşı dram seriallarından biridir.",

            "matrix": "The Matrix — gerçəkliyin simulyasiya olduğunu və insanlığın maşınlar tərəfindən idarə edildiyini göstərən fəlsəfi filmdir.",
            "dark": "Dark — zaman səyahətinin səbəb olduğu paradoksları araşdıran dahi Alman istehsalı sirr və dram serialıdır.",
            "up": "Pixar-ın 'Up' animasiya filmi — Karl və Ellinin həyat hekayəsindən bəhs edən unikal və emosional şah əsərdir.",

            // Avtomobillər
            "ferrari": "Ferrari — İtaliyanın məşhur idman avtomobilləri istehsalçısı və Formula 1 əfsanəsidir.",
            "lamborghini": "Lamborghini — aqressiv dizaynı və güclü mühərrikləri ilə tanınan İtalyan superkar markasıdır.",
            "tesla": "Tesla — elektromobillər və təmiz enerji sahəsində lider olan qlobal texnologiya şirkətidir.",
            "bmw": "BMW — 'Sürüş həzz' prinsipi ilə tanınan lüks alman avtomobil markasıdır.",
            "mercedes-benz": "Mercedes-Benz — qabaqcıl texnologiyaları və rahatlığı ilə seçilən alman avtomobil nəhəngidir.",
            "porsche": "Porsche — idman avtomobilləri və yüksək performanslı mühəndisliyi ilə tanınan alman markasıdır.",

            // Elm və Kosmos
            "kvant fizikası": "Kvant fizikası — atom və subatom səviyyədə maddə və enerjinin davranışını öyrənən elm sahəsidir.",
            "qara dəlik": "Qara dəlik — cazibə qüvvəsi işığın belə qaçmasına imkan verməyən nəhəng kosmik obyektdir.",
            "albert eynşteyn": "Albert Eynşteyn — nisbilik nəzəriyyəsinin müəllifi, fizika elmini dəyişdirən dahi fizikdir.",
            "isaak nyuton": "İsaak Nyuton — klassik mexanikanın təməlini qoyan və cazibə qüvvəsini kəşf edən dahi alimdir.",
            "nikola tesla": "Nikola Tesla — alternativ cərəyan və simsiz texnologiyalar sahəsində inqilab edən dahi ixtiraçıdır.",
            "stiven hokinq": "Stiven Hokinq — qara dəliklər və kosmologiya sahəsində dahi kəşflər etmiş fizikdir.",
            "kosmos": "Kosmos — Yer atmosferindən kənarda yerləşən sonsuz ulduzlar, qalaktikalar və planetlər sistemidir.",

            // Ölkələr və Paytaxtlar (Telefon Kodları)
            "azerbaycan": "Azərbaycan — Cənubi Qafqazda yerləşən müstəqil dövlətdir. Paytaxtı Bakıdır. Beynəlxalq telefon kodu: +994.",
            "türkiyə": "Türkiyə Cümhuriyyəti — Asiya və Avropanı birləşdirən strateji ölkədir. Paytaxtı Ankaradır. Beynəlxalq telefon kodu: +90.",
            "yaponiya": "Yaponiya — qabaqcıl texnologiyaları və unikal mədəniyyəti ilə seçilən ada ölkəsidir. Paytaxtı Tokiodur. Beynəlxalq telefon kodu: +81.",
            "cənubi koreya": "Cənubi Koreya — Şərqi Asiyada yerləşən texnologiya və mədəniyyət mərkəzidir. Paytaxtı Seuldur. Beynəlxalq telefon kodu: +82.",
            "çin": "Çin Xalq Respublikası — nəhəng iqtisadiyyata malik qlobal dövlətdir. Paytaxtı Pekindir. Beynəlxalq telefon kodu: +86.",
            "hollandiya": "Hollandiya (Niderland) — kanalları və inkişaf etmiş iqtisadiyyatı ilə seçilən Avropa ölkəsidir. Paytaxtı Amsterdamdır. Beynəlxalq telefon kodu: +31.",
            "rusiya": "Rusiya Federasiyası — ərazisinə görə dünyanın ən böyük ölkəsidir. Paytaxtı Moskvadır. Beynəlxalq telefon kodu: +7.",
            "almaniya": "Almaniya — güclü mühəndislik və avtomobil sənayesinə malik Avropa dövlətidir. Paytaxtı Berlindir. Beynəlxalq telefon kodu: +49.",
            "fransa": "Fransa — incəsənət və mədəniyyət mərkəzi olan Avropa ölkəsidir. Paytaxtı Parisdir. Beynəlxalq telefon kodu: +33.",
            "italiya": "İtaliya — qədim Roma irsi və mətbəxi ilə məşhur Aralıq dənizi ölkəsidir. Paytaxtı Romadır. Beynəlxalq telefon kodu: +39.",
            "isveçrə": "İsveçrə — Alp dağları, bank sistemi və saatları ilə seçilən ölkədir. Paytaxtı Bernedir. Beynəlxalq telefon kodu: +41.",
            "sloveniya": "Sloveniya — yaşıl təbiəti və Alp dağları ilə seçilən Mərkəzi Avropa ölkəsidir. Paytaxtı Lyublyanadır. Beynəlxalq telefon kodu: +386.",
            "amerika": "Amerika Birləşmiş Ştatları (ABŞ) — qlobal iqtisadiyyat və elm mərkəzidir. Paytaxtı Vaşinqtondur. Beynəlxalq telefon kodu: +1.",

            // Proqramlaşdırma və Texnologiya
            "python": "Python — süni intellekt, data elmi və veb inqilabında istifadə edilən güclü proqramlaşdırma dilidir.",
            "javascript": "JavaScript — veb səhifələrə interaktivlik qazandıran internetin əsas proqramlaşdırma dilidir.",
            "react": "React — interfeyslər yaratmaq üçün Meta tərəfindən hazırlanmış populyar JavaScript kitabxanasıdır.",
            "next.js": "Next.js — səhifə optimizasiyası və server tərəfli renderinq təmin edən qabaqcıl React freymvorkudur.",
            "github": "GitHub — proqramçıların kod bazalarını saxladığı və idarə etdiyi qlobal platformadır.",
            "vercel": "Vercel — tətbiqləri bulud üzərində sürətlə yerləşdirmək (deploy) üçün istifadə olunan platformadır.",
            "bitcoin": "Bitcoin — blokçeyn texnologiyasına əsaslanan ilk və ən məşhur rəqəmsal valyutadır.",
            "süni intellekt": "Süni intellekt (AI) — kompüter sistemlərinin insan kimi düşünmək, öyrənmək və qərar vermək qabiliyyətidir."
        };

        function sendPreset(text) {
            document.getElementById('user-input').value = text;
            sendMsg();
        }

        function sendMsg() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if (!text) return;

            container.innerHTML += `<div class="message user">${text}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            setTimeout(() => {
                const lower = text.toLowerCase();
                let reply = "";

                // 1. Riyazi hesablamaların avtomatik həlli
                if (/[0-9]/.test(lower) && (/[\+\-\*\/\^]/.test(lower))) {
                    try {
                        let cleanExpr = text.replace(/[^0-9+\-*/().]/g, '');
                        if (cleanExpr.length > 0) {
                            let result = eval(cleanExpr);
                            reply = `Nəticə: ${result}`;
                        }
                    } catch (e) {}
                }

                // 2. Ultimate Bazadan Axtarış
                if (!reply) {
                    for (let key in knowledgeBase) {
                        if (lower.includes(key)) {
                            reply = knowledgeBase[key];
                            break;
                        }
                    }
                }

                // 3. Əgər bazada tapılmasa
                if (!reply) {
                    reply = `Ofojero ultimate bazanı skan etdi: "${text}" sorğusu qəbul olundu. Bu mövzu da növbəti yeniləmədə bazaya daxil ediləcək!`;
                }

                container.innerHTML += `<div class="message ai">${reply}</div>`;
                container.scrollTop = container.scrollHeight;
            }, 300);
        }
    </script>
</body>
</html>
