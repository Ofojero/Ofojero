<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Ofojero Intelligence</title>
    <style>
        body { background: #090d16; color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        header { background: #111827; padding: 18px; text-align: center; font-size: 1.3rem; font-weight: 700; border-bottom: 1px solid #1f2937; display: flex; align-items: center; justify-content: center; gap: 10px; letter-spacing: 0.5px; }
        .logo-icon { width: 22px; height: 22px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 50%; display: inline-block; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; max-width: 750px; margin: 0 auto; width: 100%; }
        .message { padding: 14px 18px; border-radius: 16px; max-width: 80%; line-height: 1.6; word-break: break-word; font-size: 0.95rem; }
        .user { background: #2563eb; align-self: flex-end; color: white; border-bottom-right-radius: 4px; }
        .ai { background: #1f2937; align-self: flex-start; color: #e5e7eb; border-bottom-left-radius: 4px; border: 1px solid #374151; }
        #input-area { padding: 20px; background: #111827; display: flex; justify-content: center; border-top: 1px solid #1f2937; }
        .input-wrapper { width: 100%; max-width: 700px; display: flex; background: #1f2937; border-radius: 30px; border: 1px solid #374151; padding: 5px; }
        input { flex: 1; padding: 12px 18px; border: none; background: transparent; color: white; outline: none; font-size: 1rem; }
        button { padding: 10px 22px; border-radius: 24px; border: none; background: #3b82f6; color: white; cursor: pointer; font-weight: 600; transition: 0.2s; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <header>
        <span class="logo-icon"></span>
        Ofojero Intelligence
    </header>
    
    <div id="chat-container">
        <div class="message ai">Salam! Mən Ofojero Intelligence sistemiyəm. Bu gün sizə necə kömək edə bilərəm?</div>
    </div>

    <div id="input-area">
        <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="Mesajınızı daxil edin..." onkeydown="handleKey(event)">
            <button onclick="getAIResponse()">Göndər</button>
        </div>
    </div>

    <script>
        const apiKey = "Gsk_IxcyBBNPv7j8Z1yraQyCWGdyb3FY59xRePkYXRpP40Fj7Gnq3oCU";

        async function getAIResponse() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if (!text) return;

            container.innerHTML += `<div class="message user">${text}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            container.innerHTML += `<div class="message ai" id="${loadingId}">Düşünülür...</div>`;
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${apiKey}`, 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: text }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data && data.choices && data.choices.length > 0 && data.choices[0].message) {
                    const aiReply = data.choices[0].message.content;
                    container.innerHTML += `<div class="message ai">${aiReply}</div>`;
                } else if (data.error) {
                    container.innerHTML += `<div class="message ai">API Xətası: ${data.error.message}</div>`;
                } else {
                    container.innerHTML += `<div class="message ai">Cavab formatı uyğun gəlmədi.</div>`;
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                container.innerHTML += `<div class="message ai">Bağlantı xətası baş verdi.</div>`;
            }
            container.scrollTop = container.scrollHeight;
        }

        function handleKey(event) {
            if (event.key === 'Enter') {
                getAIResponse();
            }
        }
    </script>
</body>
</html>
