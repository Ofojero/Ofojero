<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofojero AI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #1e293b;
            padding: 1rem;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            border-bottom: 1px solid #334155;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            max-width: 75%;
            line-height: 1.5;
        }
        .user-message {
            background-color: #3b82f6;
            color: white;
            align-self: flex-end;
        }
        .ai-message {
            background-color: #334155;
            color: #f8fafc;
            align-self: flex-start;
        }
        #input-container {
            background-color: #1e293b;
            padding: 1rem;
            display: flex;
            justify-content: center;
            border-top: 1px solid #334155;
        }
        #input-box {
            width: 100%;
            max-width: 800px;
            display: flex;
            gap: 0.5rem;
        }
        input {
            flex: 1;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            outline: none;
        }
        button {
            padding: 0.75rem 1.5rem;
            border: none;
            background-color: #3b82f6;
            color: white;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <header>Ofojero AI Köməkçisi</header>

    <div id="chat-container">
        <div class="message ai-message">Salam! Mən Ofojero AI-yam. Sizə necə kömək edə bilərəm?</div>
    </div>

    <div id="input-container">
        <div id="input-box">
            <input type="text" id="user-input" placeholder="Mesajınızı bura yazın..." onkeydown="if(event.key === 'Yaz') sendMessage()">
            <button onclick="sendMessage()">Göndər</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const userText = inputField.value.trim();

            if (!userText) return;

            // İstifadəçinin mesajını əlavə et
            const userMessageDiv = document.createElement('div');
            userMessageDiv.className = 'message user-message';
            userMessageDiv.textContent = userText;
            chatContainer.appendChild(userMessageDiv);

            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Süni intellektin cavabı (sadə simulyasiya / cavab sistemi)
            setTimeout(() => {
                const aiMessageDiv = document.createElement('div');
                aiMessageDiv.className = 'message ai-message';
                aiMessageDiv.textContent = "Ofojero AI olaraq dediyinizi başa düşdüm: \"" + userText + "\". Bu hələ başlanğıcdır, növbəti mərhələdə daha da güclənəcəyəm!";
                chatContainer.appendChild(aiMessageDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 1000);
        }
    </script>
</body>
</html>
