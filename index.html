<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Ofojero - Infinity Maximus AI</title>
    <style>
        :root {
            --bg-deep: #030407;
            --bg-panel: #080c14;
            --bg-input: #0d1322;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --danger: #ef4444;
        }

        body {
            background: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        header {
            background: var(--bg-panel);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--accent);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 1050px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        .message {
            padding: 16px 20px;
            border-radius: 16px;
            max-width: 85%;
            line-height: 1.6;
            word-break: break-word;
            font-size: 1.02rem;
            animation: fadeIn 0.3s ease-out;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            align-self: flex-end;
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25);
        }

        .ai {
            background: var(--bg-panel);
            align-self: flex-start;
            color: var(--text-main);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .tts-btn {
            position: absolute;
            bottom: 8px;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 2px 6px;
        }
        .tts-btn:hover { color: var(--accent); }

        .quick-topics {
            display: flex;
            gap: 10px;
            padding: 0 24px 12px 24px;
            max-width: 1050px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            overflow-x: auto;
        }

        .topic-pill {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .topic-pill:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--bg-input);
        }

        #input-area {
            padding: 20px 24px;
            background: var(--bg-panel);
            display: flex;
            justify-content: center;
            border-top: 1px solid var(--border);
        }

        .input-wrapper {
            width: 100%;
            max-width: 1000px;
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border-radius: 35px;
            border: 1px solid var(--border);
            padding: 6px 12px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
        }

        input {
            flex: 1;
            padding: 12px 14px;
            border: none;
            background: transparent;
            color: white;
            outline: none;
            font-size: 1.02rem;
        }

        .action-icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 8px;
            transition: color 0.2s;
        }
        .action-icon-btn:hover { color: var(--accent); }
        .action-icon-btn.listening { color: var(--danger); animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        button.send-btn {
            padding: 10px 24px;
            border-radius: 30px;
            border: none;
            background: var(--accent);
            color: var(--bg-deep);
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: background 0.2s, transform 0.1s;
        }

        button.send-btn:hover { background: var(--accent-hover); }
        button.send-btn:active { transform: scale(0.97); }
    </style>
</head>
