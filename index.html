<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Ofojero Intelligence - Maximus Infinite Universe Edition</title>
    <style>
        :root {
            --bg-deep: #030407;
            --bg-panel: #080c14;
            --bg-input: #0d1322;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        body {
            background: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        header {
            background: var(--bg-panel);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--accent);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .status-badge {
            font-size: 0.8rem;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            font-weight: 600;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 1050px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        .message {
            padding: 16px 20px;
            border-radius: 16px;
            max-width: 85%;
            line-height: 1.6;
            word-break: break-word;
            font-size: 1.02rem;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            align-self: flex-end;
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25);
        }

        .ai {
            background: var(--bg-panel);
            align-self: flex-start;
            color: var(--text-main);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .quick-topics {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 8px 24px 14px 24px;
            max-width: 1050px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .topic-pill {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.88rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            font-weight: 500;
        }

        .topic-pill:hover {
            background: var(--accent);
            color: var(--bg-deep);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        #input-area {
            padding: 20px 24px;
            background: var(--bg-panel);
            display: flex;
            justify-content: center;
            border-top: 1px solid var(--border);
        }

        .input-wrapper {
            width: 100%;
            max-width: 1000px;
            display: flex;
            background: var(--bg-input);
            border-radius: 35px;
            border: 1px solid var(--border);
            padding: 6px 8px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
        }

        input {
            flex: 1;
            padding: 12px 18px;
            border: none;
            background: transparent;
            color: white;
            outline: none;
            font-size: 1.02rem;
        }

        button {
            padding: 12px 28px;
            border-radius: 30px;
            border: none;
            background: var(--accent);
            color: var(--bg-deep);
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover { background: var(--accent-hover); }
        button:active { transform: scale(0.97); }
    </style>
</head>
