<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Ofojero Intelligence</title>
    <style>
        body { background: #090d16; color: #f3f4f6; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        header { background: #111827; padding: 18px; text-align: center; font-size: 1.3rem; font-weight: 700; border-bottom: 1px solid #1f2937; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; max-width: 750px; margin: 0 auto; width: 100%; }
        .message { padding: 14px 18px; border-radius: 16px; max-width: 80%; line-height: 1.6; word-break: break-word; }
        .user { background: #2563eb; align-self: flex-end; color: white; }
        .ai { background: #1f2937; align-self: flex-start; color: #e5e7eb; border: 1px solid #374151; }
        #input-area { padding: 20px; background: #111827; display: flex; justify-content: center; border-top: 1px solid #1f2937; }
        .input-wrapper { width: 100%; max-width: 700px; display: flex; background: #1f2937; border-radius: 30px; border: 1px solid #374151; padding: 5px; }
        input { flex: 1; padding: 12px 18px; border: none; background: transparent; color: white; outline: none; font-size: 1rem; }
        button { padding: 10px 22px; border-radius: 24px; border: none; background: #3b82f6; color: white; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>
    <header>Ofojero Intelligence</header>
    
    <div id="chat-container">
        <div class="message ai">Salam! Mən Ofojero Intelligence sistemiyəm. Dünyanın tarixi, elmi, texnologiyası və ya istənilən digər mövzusunda sualını verə bilərsən.</div>
    </div>

    <div id="input-area">
        <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="Dünyadan nə bilmək istəyirsən? Yaz..." onkeydown="if(event.key==='Enter') sendMsg()">
            <button onclick="sendMsg()">Göndər</button>
        </div>
    </div>

    <script>
        const globalDatabase = {
            "kosmos": "Kosmos — kainatdakı bütün materiya, enerji, ulduzlar, qalaktikalar və planetlərin yerləşdiyi sonsuz fəzadır. Böyük Partlayış (Big Bang) nəticəsində təqribən 13.8 milyard il əvvəl yaranmışdır.",
            "tarix": "Bəşər tarixi qədim sivilizasiyalardan (Sümer, Misir, Qədim Roma), orta əsr imperiyalarından, intibah dövründən və müasir texnologiya əsrindən keçərək günümüzə qədər gəlib çatmışdır.",
            "elm": "Elm — təbiətin və cəmiyyətin qanunauyğunluqlarını öyrənən, sübuta və təcrübələrə əsaslanan sistemli biliklər toplusudur. Fizika, kimya, biologiya və riyaziyyat əsas elm sahələridir.",
            "texnologiya": "Texnologiya — elmi biliklərin praktiki həyatda tətbiqi, maşınlar, kompüterlər, süni intellekt və rəqəmsal sistemlərin yaradılması prosesidir.",
            "azerbaycan": "Azərbaycan — Qafqazın cənubunda yerləşən, zəngin təbii sərvətlərə (neft, qaz), qədim mədəniyyətə və strateji coğrafi mövqeyə malik respublikadır.",
            "dünya": "Yer kürəsi — Günəş sistemində həyatın mövcud olduğu məlum olan yeganə planetdir. Səthinin təqribən 71%-i sudan, 29%-i isə quru sahələrindən ibarətdir."
        };

        function sendMsg() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if (!text) return;

            container.innerHTML += `<div class="message user">${text}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            setTimeout(() => {
                const lowerText = text.toLowerCase();
                let reply = "";

                for (let key in globalDatabase) {
                    if (lowerText.includes(key)) {
                        reply = globalDatabase[key];
                        break;
                    }
                }

                if (!reply) {
                    reply = `Ofojero Intelligence qlobal bazası yoxlayır: "${text}" haqqında dünyada bir çox məlumat mövcuddur. Bu mövzu elm, tarix və ya müasir həyatla sıx bağlıdır. Sənə bu haqda daha dəqiq hansı tərəfini izah edim?`;
                }

                container.innerHTML += `<div class="message ai">${reply}</div>`;
                container.scrollTop = container.scrollHeight;
            }, 600);
        }
    </script>
</body>
</html>
