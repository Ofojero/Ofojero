<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofojero</title>
    <style>
        :root {
            --bg-deep: #030407;
            --bg-panel: #080c14;
            --bg-input: #0d1322;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        body {
            background: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        header {
            background: var(--bg-panel);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            flex-shrink: 0;
        }

        .icon-btn {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .icon-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 1050px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        .message {
            padding: 16px 20px;
            border-radius: 16px;
            max-width: 85%;
            line-height: 1.6;
            word-break: break-word;
            font-size: 1.02rem;
            position: relative;
        }

        .user {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            align-self: flex-end;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai {
            background: var(--bg-panel);
            align-self: flex-start;
            color: var(--text-main);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .tts-btn {
            position: absolute;
            bottom: 8px;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
        }
        .tts-btn:hover { color: var(--accent); }

        #input-area {
            padding: 20px 24px;
            background: var(--bg-panel);
            display: flex;
            justify-content: center;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .input-wrapper {
            width: 100%;
            max-width: 1000px;
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border-radius: 35px;
            border: 1px solid var(--border);
            padding: 6px 12px;
        }

        input {
            flex: 1;
            padding: 12px 14px;
            border: none;
            background: transparent;
            color: white;
            outline: none;
            font-size: 1.02rem;
        }

        button.send-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent);
            color: var(--bg-deep);
            cursor: pointer;
            font-size: 1.3rem;
            font-weight: bold;
            border: none;
        }

        button.send-btn:hover { background: var(--accent-hover); }
    </style>
</head>
<body>
    <header>
        <span>Ofojero</span>
        <button class="icon-btn" id="clear-btn" onclick="clearHistory()">🗑️ Tarixçəni Sil</button>
    </header>
    
    <div id="chat-container"></div>

    <div id="input-area">
        <div class="input-wrapper">

        </div>

            "rusiya": "Rusiya Federasiyası — Dünyanın ən böyük ərazisinə malik Avrasiya dövlətidir. Paytaxtı Moskvadır. Beynəlxalq telefon kodu: +7.",
        };

        window.onload = function() {
            loadHistory();
        };

        function loadHistory() {
            const container = document.getElementById('chat-container');
            const savedHistory = localStorage.getItem('ofojero_history');
            if (savedHistory) {
                container.innerHTML = savedHistory;
            } else {
                container.innerHTML = `<div class="message ai">Salam! Mən Ofojero-yam. Sualınızı gözləyirəm.</div>`;
            }
            container.scrollTop = container.scrollHeight;
        }

        function saveHistory() {
            const container = document.getElementById('chat-container');
            localStorage.setItem('ofojero_history', container.innerHTML);
        }

        function clearHistory() {
            localStorage.removeItem('ofojero_history');
            document.getElementById('chat-container').innerHTML = `<div class="message ai">Tarixçə təmizləndi.</div>`;
        }

       function speakText(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'az-AZ';
        window.speechSynthesis.speak(utterance);
    }
}

function sendMsg() {
    const input = document.getElementById('user-input');
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;

    const container = document.getElementById('chat-container');
    if (!container) return;

    const userMsg = document.createElement('div');
    userMsg.className = 'message user';
    userMsg.textContent = text;
    container.appendChild(userMsg);

    input.value = '';
    container.scrollTop = container.scrollHeight;

    setTimeout(async () => {
        try {
            const aiResponse = await askOfojero(text);
            const aiMsg = document.createElement('div');
            aiMsg.className = 'message ai';
            aiMsg.innerHTML = `${aiResponse}<button class="tts-btn" onclick="speakText('${aiResponse}')">🔊</button>`;
            container.appendChild(aiMsg);
            container.scrollTop = container.scrollHeight;
            saveHistory();
        } catch (err) {
            console.error("Xəta:", err);
        }
    }, 300);
}
