<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Ofojero AI Pro</title>
    <style>
        :root {
            --bg: #030712;
            --chat-bg: #111827;
            --ai-msg: #1f2937;
            --user-msg: #3b82f6;
            --text: #f9fafb;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 20px; text-align: center; font-size: 1.5rem; font-weight: 800; background: var(--chat-bg); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; max-width: 700px; margin: 0 auto; width: 100%; }
        .message { padding: 12px 18px; border-radius: 18px; max-width: 80%; line-height: 1.6; font-size: 1rem; }
        .user-message { background: var(--user-msg); align-self: flex-end; color: white; border-bottom-right-radius: 4px; }
        .ai-message { background: var(--ai-msg); align-self: flex-start; color: var(--text); border-bottom-left-radius: 4px; }
        #input-area { padding: 20px; background: var(--chat-bg); display: flex; justify-content: center; }
        input { width: 100%; max-width: 600px; padding: 15px; border-radius: 30px; border: 1px solid #374151; background: #1f2937; color: white; outline: none; }
        button { margin-left: 10px; padding: 10px 20px; border-radius: 20px; border: none; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <header>Ofojero AI Pro ✨</header>
    <div id="chat-container">
        <div class="message ai-message">Salam! Mən Ofojero-yam. Sənin üçün nə edə bilərəm?</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Mesajını yaz...">
        <button onclick="sendMessage()">Göndər</button>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            if (!input.value) return;

            // İstifadəçi mesajı
            container.innerHTML += `<div class="message user-message">${input.value}</div>`;
            const userText = input.value;
            input.value = '';

            // AI cavabı (animasiya kimi)
            setTimeout(() => {
                container.innerHTML += `<div class="message ai-message">Ofojero başa düşdü: ${userText}... (Həqiqi AI inteqrasiyası üçün hazıram!)</div>`;
                container.scrollTop = container.scrollHeight;
            }, 500);
        }
    </script>
</body>
</html>
