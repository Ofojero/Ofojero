<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofojero</title>
    <style>
        :root {
            --accent: #00ff88;
            --accent-hover: #00cc6a;
            --bg-deep: #0a0c10;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            background-color: var(--bg-deep);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Arka Plan Video */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: -1;
        }

        #bg-video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        /* Üst Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 30px;
            background: rgba(10, 12, 16, 0.3);
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        header span {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            cursor: pointer;
            font-size: 1.1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: var(--accent);
            color: var(--bg-deep);
            border-color: var(--accent);
        }

        /* Ortadaki Şeffaf Chat Kutusu (Tam İkinci Fotoğraftaki Gibi) */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 5;
        }

        .chat-section {
            width: 100%;
            max-width: 580px;
            height: 72vh;
            background: rgba(10, 15, 20, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* Mesaj Alanı */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 6px;
            margin-bottom: 15px;
            scroll-behavior: smooth;
        }

        #chat-container::-webkit-scrollbar {
            width: 5px;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.4;
            max-width: 82%;
            word-break: break-word;
            position: relative;
        }

        .message.user {
            background: rgba(0, 255, 136, 0.25);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .message.ai {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border-left: 3px solid var(--accent);
            padding-bottom: 28px;
        }

        .tts-btn {
            position: absolute;
            bottom: 6px;
            right: 10px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
        }
        .tts-btn:hover { color: var(--accent); }

        /* Yazı Input Alanı */
        #input-area {
            width: 100%;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.07);
            padding: 6px 10px 6px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        button.send-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--accent);
            color: var(--bg-deep);
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        button.send-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }

        .voice-btn {
            display: inline-flex;
            align-items: flex-end;
            gap: 2px;
            padding: 6px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            cursor: pointer;
            height: 38px;
            width: 38px;
            justify-content: center;
            transition: 0.2s;
        }

        .voice-btn:hover {
            border-color: var(--accent);
        }

        .voice-bar {
            width: 2px;
            background: var(--accent);
            border-radius: 9999px;
        }
    </style>
</head>

const API_KEY = "BURAYA_API_KEY_YAZIN";

// Gemini-yə sorğu göndərən əsas funksiya
async function getGeminiResponse(userMessage) {
    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                contents: [{ parts: [{ text: userMessage }] }]
            })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content.parts[0].text) {
            return data.candidates[0].content.parts[0].text;
        } else {
            return "Cavab almaq mümkün olmadı.";
        }
    } catch (error) {
        console.error("API Xətası:", error);
        return "Şəbəkə xətası baş verdi.";
    }
}

        window.onload = function() {
            loadHistory();
        };

        function loadHistory() {
            const container = document.getElementById('chat-container');
            const savedHistory = localStorage.getItem('ofojero_history');
            if (savedHistory) {
                container.innerHTML = savedHistory;
            } else {
                container.innerHTML = `<div class="message ai">Salam! Mən Ofojero-yam. Sualınızı gözləyirəm.</div>`;
            }
            container.scrollTop = container.scrollHeight;
        }

        function saveHistory() {
            const container = document.getElementById('chat-container');
            localStorage.setItem('ofojero_history', container.innerHTML);
        }

        function clearHistory() {
            localStorage.removeItem('ofojero_history');
            document.getElementById('chat-container').innerHTML = `<div class="message ai">Tarixçə təmizləndi.</div>`;
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'az-AZ';
                window.speechSynthesis.speak(utterance);
            }
        }

        function sendMsg() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            const container = document.getElementById('chat-container');

            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            container.appendChild(userMsg);

            input.value = '';
            container.scrollTop = container.scrollHeight;

            setTimeout(() => {
                const query = text.toLowerCase();
                let aiResponse = "Bu mövzu haqqında məlumat bazamda yoxdur, lakin Ofojero sistemi daim yenilənir!";

                for (let key in maximusDatabase) {
                    if (query.includes(key)) {
                        aiResponse = maximusDatabase[key];
                        break;
                    }
                }

                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai';
                aiMsg.innerHTML = `${aiResponse}<button class="tts-btn" onclick="speakText('${aiResponse.replace(/'/g, "\\'")}')">🔊 Dinlə</button>`;
                container.appendChild(aiMsg);
                container.scrollTop = container.scrollHeight;
                saveHistory();
            }, 300);
        }
