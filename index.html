<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Ofojero Intelligence</title>
    <style>
        body { background: #090d16; color: #f3f4f6; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        header { background: #111827; padding: 18px; text-align: center; font-size: 1.3rem; font-weight: 700; border-bottom: 1px solid #1f2937; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; max-width: 750px; margin: 0 auto; width: 100%; }
        .message { padding: 14px 18px; border-radius: 16px; max-width: 80%; line-height: 1.6; word-break: break-word; }
        .user { background: #2563eb; align-self: flex-end; color: white; }
        .ai { background: #1f2937; align-self: flex-start; color: #e5e7eb; border: 1px solid #374151; }
        #input-area { padding: 20px; background: #111827; display: flex; justify-content: center; border-top: 1px solid #1f2937; }
        .input-wrapper { width: 100%; max-width: 700px; display: flex; background: #1f2937; border-radius: 30px; border: 1px solid #374151; padding: 5px; }
        input { flex: 1; padding: 12px 18px; border: none; background: transparent; color: white; outline: none; font-size: 1rem; }
        button { padding: 10px 22px; border-radius: 24px; border: none; background: #3b82f6; color: white; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>
    <header>Ofojero Intelligence</header>
    
    <div id="chat-container">
        <div class="message ai">Salam! Mən Ofojero Intelligence-əm. Nə istəyirsən danışaq, hər şeyi bilirəm. Sualını ver və ya mövzu aç.</div>
    </div>

    <div id="input-area">
        <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="Nə haqqında danışaq? Yaz..." onkeydown="if(event.key==='Enter') sendMsg()">
            <button onclick="sendMsg()">Göndər</button>
        </div>
    </div>

    <script>
        let lastTopic = "";

        function sendMsg() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if (!text) return;

            container.innerHTML += `<div class="message user">${text}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            setTimeout(() => {
                const lower = text.toLowerCase();
                let reply = "";

                if (lower.includes("sonra") || lower.includes("davam et") || lower.includes("həmçinin")) {
                    if (lastTopic.includes("tarix") || lastTopic.includes("azərbaycan")) {
                        reply = "Davam edək: Azərbaycanın qədim dövlətçilik tarixi Manna, İskit, Atropatena və Albaniya ilə başlayır. Orta əsrlərdə Şirvanşahlar, Səfəvilər kimi nəhəng imperiyalar qurulub. XX əsrdə isə 1918-ci ildə Şərqdə ilk demokratik respublika — Azərbaycan Xalq Cümhuriyyəti yaradıldı.";
                    } else if (lastTopic.includes("kosmos") || lastTopic.includes("elm")) {
                        reply = "Davam edək: Kainatda milyardlarla qalaktika var. Bizim Süd Yolu qalaktikamızda isə yüz milyardlarla ulduz mövcuddur. Alimlər həmçinin qara dəliklərin mərkəzindəki sirli qravitasiya qüvvəsini və zamanın bükülməsini öyrənirlər.";
                    } else {
                        reply = "Əlbəttə, mövzunu dərindən davam etdirək: Bu sahə özündə çoxlu maraqlı faktları birləşdirir. Konkret hansı dövrü və ya detalı dərindən araşdıraq?";
                    }
                } else {
                    lastTopic = lower;
                    
                    if (lower.includes("tarix") || lower.includes("azərbaycan") || lower.includes("dövlət")) {
                        reply = "Azərbaycan tarixi qədim sivilizasiyaların mərkəzi olub. Qobustan qayalarındakı minillik rəsmlər, azıxantropun izləri və qədim ticarət yolları bu torpağın nə qədər zəngin olduğunu göstərir. (Ətraflı davam etmək üçün 'sonra' yazabilərsən).";
                    } else if (lower.includes("kosmos") || lower.includes("kainat") || lower.includes("elm")) {
                        reply = "Kainat təqribən 13.8 milyard əvvəl Böyük Partlayışla (Big Bang) yaranıb. O vaxtdan bəri dayanmadan genişlənir. İşığın sürəti ilə belə kainatın bir ucundan digərinə getmək milyardlarla il çəkər.";
                    } else if (lower.includes("sen kimsən") || lower.includes("adın")) {
                        reply = "Mən Ofojero Intelligence sistemiyəm. Heç bir məhdudiyyətsiz, tam açıq şəkildə sənə dünyanın istənilən məlumatını çatdırmaq üçün yığılmışam.";
                    } else {
                        reply = `"${text}" mövzusu olduqca maraqlıdır. Dünyada bu haqda çoxlu elmi və tarixi faktlar mövcuddur. İstəyirsən bu haqda daha detallı məlumat verim, sadəcə "davam et" və ya "sonra" yaz.`;
                    }
                }

                container.innerHTML += `<div class="message ai">${reply}</div>`;
                container.scrollTop = container.scrollHeight;
            }, 600);
        }
    </script>
</body>
</html>
