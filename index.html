<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Ofojero Intelligence</title>
    <style>
        body { background: #090d16; color: #f3f4f6; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        header { background: #111827; padding: 18px; text-align: center; font-size: 1.3rem; font-weight: 700; border-bottom: 1px solid #1f2937; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; max-width: 750px; margin: 0 auto; width: 100%; }
        .message { padding: 14px 18px; border-radius: 16px; max-width: 80%; line-height: 1.6; word-break: break-word; }
        .user { background: #2563eb; align-self: flex-end; color: white; }
        .ai { background: #1f2937; align-self: flex-start; color: #e5e7eb; border: 1px solid #374151; }
        #input-area { padding: 20px; background: #111827; display: flex; justify-content: center; border-top: 1px solid #1f2937; }
        .input-wrapper { width: 100%; max-width: 700px; display: flex; background: #1f2937; border-radius: 30px; border: 1px solid #374151; padding: 5px; }
        input { flex: 1; padding: 12px 18px; border: none; background: transparent; color: white; outline: none; font-size: 1rem; }
        button { padding: 10px 22px; border-radius: 24px; border: none; background: #3b82f6; color: white; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>
    <header>Ofojero Intelligence</header>
    
    <div id="chat-container">
        <div class="message ai">Salam! Mən Ofojero Intelligence sistemiyəm. Dünyanın tarixi, elmi və ya istənilən sirri haqqında soruşa bilərsən.</div>
    </div>

    <div id="input-area">
        <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="Nə bilmək istəyirsən? Yaz..." onkeydown="if(event.key==='Enter') sendMsg()">
            <button onclick="sendMsg()">Göndər</button>
        </div>
    </div>

    <script>
        function sendMsg() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if (!text) return;

            container.innerHTML += `<div class="message user">${text}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            setTimeout(() => {
                const lower = text.toLowerCase();
                let reply = "";

                if (lower.includes("tarix") || lower.includes("olub") || lower.includes("keçmiş")) {
                    reply = "Dünya tarixi milyillik imperiyaların, müharibələrin, böyük kəşflərin və sivilizasiyaların yaranıb-sönməsi tarixidir. Qədim Misir, Mesopotamiya, Roma imperiyası və Böyük İpək Yolu bəşəriyyətin gedişatını dəyişdirən əsas mərhələlərdəndir.";
                } else if (lower.includes("adın") || lower.includes("kimsən") || lower.includes("necə")) {
                    reply = "Mən Ofojero Intelligence — sənin yaratdığın güclü və universal süni intellekt sistemiyəm!";
                } else if (lower.includes("elm") || lower.includes("kosmos") || lower.includes("fizika")) {
                    reply = "Elm və kainat sirrlərlə doludur. Kainat təqribən 13.8 milyard il əvvəl Böyük Partlayışla yaranıb və sürətlə genişlənir. Qara dəliklər, ulduz sistemləri və kvant fizikası dünyanın ən maraqlı mövzularındandır.";
                } else if (lower.includes("dünya") || lower.includes("həyat")) {
                    reply = "Yer kürəsi Günəş sistemində üzərində həyat olan yeganə planetdir. Burada milyonlarla canlı növü, müxtəlif mədəniyyətlər və fasiləsiz inkişaf edən sivilizasiya mövcuddur.";
                } else {
                    reply = `Ofojero Intelligence analiz edir: Sənin bu sualın ("${text}") kainatın, elmin və ya tarixin ən maraqlı qatlarına toxunur. Hər şey bir başlanğıc ilə başlayır və dünyada hər zaman öyrənilməli saysız-hesabsız sirr var!`;
                }

                container.innerHTML += `<div class="message ai">${reply}</div>`;
                container.scrollTop = container.scrollHeight;
            }, 600);
        }
    </script>
</body>
</html>
